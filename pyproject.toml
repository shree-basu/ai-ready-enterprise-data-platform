[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ready-enterprise-data-platform"
version = "0.1.0"
description = "Cloud-free reference implementation for governed analytics and enterprise AI"
requires-python = ">=3.11"
dependencies = ["apache-beam==2.75.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
